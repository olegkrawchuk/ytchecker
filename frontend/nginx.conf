server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver — re-resolves "backend" at request time
    # instead of once at nginx startup, so this container can start (and
    # serve static files) even if the backend isn't reachable yet, and
    # recovers automatically once it is.
    resolver 127.0.0.11 valid=10s;

    # Proxy API requests to backend
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — all unknown routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
